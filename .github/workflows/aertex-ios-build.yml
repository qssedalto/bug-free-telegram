name: AERTEX iOS Build (macOS/Xcode)

on:
  workflow_dispatch:
    inputs:
      signing_bundle_id:
        description: "Optional iPhone Bundle ID matching your signing profile (diagnostic only)"
        required: false
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "iOS重构版/**"
      - "watchOS/**"
      - ".github/workflows/aertex-ios-build.yml"
  push:
    branches:
      - main
      - feat/aertex-ios-2-2-real-chat-glass-20261008
      - fix/aertex-adhoc-signing-20261010
    paths:
      - "iOS重构版/**"
      - "watchOS/**"
      - ".github/workflows/aertex-ios-build.yml"

permissions:
  contents: read

concurrency:
  group: aertex-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk watchos --show-sdk-version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate original website brand artwork
        working-directory: iOS重构版
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aertex-brand-venv"
          "$RUNNER_TEMP/aertex-brand-venv/bin/python" -m pip install --disable-pip-version-check pillow
          "$RUNNER_TEMP/aertex-brand-venv/bin/python" CI/render_brand_assets.py

      - name: Confirm xtool icon matches Xcode and watchOS artwork
        working-directory: iOS重构版
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aertex-brand-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          root = Path.cwd()
          icon_path = Path("CI/GeneratedAssets.xcassets/AppIcon.appiconset/AppIcon1024.png")
          assert "iconPath: " + icon_path.as_posix() in (root / "xtool.yml").read_text(encoding="utf-8")
          phone = root / icon_path
          watch = root.parent / "watchOS/AERTEXWatch/GeneratedAssets.xcassets/AppIcon.appiconset/AppIcon1024.png"
          old_icon = root / "Build/AppIcons/AppIcon1024.png"
          with Image.open(phone) as p, Image.open(watch) as w, Image.open(old_icon) as old:
              assert p.size == w.size == (1024, 1024) and p.mode == "RGB"
              assert not ImageChops.difference(p.convert("RGB"), w.convert("RGB")).getbbox()
              assert ImageChops.difference(p.convert("RGB"), old.convert("RGB")).getbbox()
          print("Verified matching AERTEX iPhone, iPad, Watch and xtool icons")
          PY

      - name: Generate iOS application Xcode project
        working-directory: iOS重构版
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          # Xcode 26 requires the embedded modern SwiftUI Watch app in
          # PlugIns/ (not the legacy Watch/ folder). Older XcodeGen places
          # watch dependencies in Watch/; adjust only that generated phase.
          python3 - <<'PY'
          from pathlib import Path
          pbx = Path("AERTEX.xcodeproj/project.pbxproj")
          text = pbx.read_text()
          if 'dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";' in text:
              text = text.replace('dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";', 'dstPath = "";')
              text = text.replace('dstSubfolderSpec = 16;', 'dstSubfolderSpec = 13;')
              pbx.write_text(text)
              print("Applied Xcode 26 Watch embedding compatibility fix")
          PY
          xcodebuild -list -project AERTEX.xcodeproj

      - name: Compile unsigned Apple Watch companion
        run: |
          set -euo pipefail
          xcodebuild \
            -project "iOS重构版/AERTEX.xcodeproj" \
            -scheme AERTEXWatch \
            -configuration Release \
            -sdk watchos \
            -destination "generic/platform=watchOS" \
            -derivedDataPath "$RUNNER_TEMP/aertex-watch-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/aertex-watch-build.log" 2>&1 || {
              tail -n 180 "$RUNNER_TEMP/aertex-watch-build.log"
              exit 1
            }
          tail -n 20 "$RUNNER_TEMP/aertex-watch-build.log"

      - name: Compile unsigned iPhone application
        run: |
          set -euo pipefail
          xcodebuild \
            -project "iOS重构版/AERTEX.xcodeproj" \
            -scheme AERTEX \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/aertex-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/aertex-xcodebuild.log" 2>&1 || {
              tail -n 180 "$RUNNER_TEMP/aertex-xcodebuild.log"
              exit 1
            }
          tail -n 35 "$RUNNER_TEMP/aertex-xcodebuild.log"

      - name: Verify iPad-compatible iOS Simulator build
        run: |
          set -euo pipefail
          # Both iPhone and iPad use the same application and bundle ID.
          # An iPad's split workspace must compile for the simulator SDK,
          # in addition to the physical-device build above.
          xcodebuild \
            -project "iOS重构版/AERTEX.xcodeproj" \
            -scheme AERTEX \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/aertex-ipad-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/aertex-ipad-build.log" 2>&1 || {
              tail -n 180 "$RUNNER_TEMP/aertex-ipad-build.log"
              exit 1
            }
          test -s "$RUNNER_TEMP/aertex-ipad-derived/Build/Products/Release-iphonesimulator/AERTEX.app/AERTEX"
          tail -n 18 "$RUNNER_TEMP/aertex-ipad-build.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/aertex-derived/Build/Products/Release-iphoneos/AERTEX.app"
          test -d "$app"
          test -s "$app/AERTEX"
          # The iPhone build must actually contain the watchOS companion.
          test -d "$app/PlugIns/AERTEXWatch.app"
          test -s "$app/PlugIns/AERTEXWatch.app/AERTEXWatch"
          mkdir -p dist/Payload
          ditto "$app" "dist/Payload/AERTEX.app"
          ( cd dist && zip -qry AERTEX-unsigned.ipa Payload )
          test -s dist/AERTEX-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$app/Info.plist"
          ls -lh dist/AERTEX-unsigned.ipa

      - name: Validate Apple bundles and package iPhone-only signing diagnostic
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/aertex-derived/Build/Products/Release-iphoneos/AERTEX.app"
          watch="$app/PlugIns/AERTEXWatch.app"
          plutil -lint "$app/Info.plist" "$watch/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "com.tglab.shifourentong.ios"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$watch/Info.plist")" = "com.tglab.shifourentong.ios.watchkitapp"
          file "$app/AERTEX" "$watch/AERTEXWatch"
          # Test isolation only: not the final Watch-enabled app.
          mkdir -p "$RUNNER_TEMP/aertex-phone-only/Payload"
          ditto "$app" "$RUNNER_TEMP/aertex-phone-only/Payload/AERTEX.app"
          rm -rf "$RUNNER_TEMP/aertex-phone-only/Payload/AERTEX.app/PlugIns/AERTEXWatch.app"
          ( cd "$RUNNER_TEMP/aertex-phone-only" && zip -qry "$GITHUB_WORKSPACE/dist/AERTEX-iphone-only-unsigned.ipa" Payload )
          test -s dist/AERTEX-iphone-only-unsigned.ipa

      - name: Prepare iPhone-only IPA matching optional provisioning Bundle ID
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_bundle_id != '' }}
        env:
          SIGNING_BUNDLE_ID: ${{ inputs.signing_bundle_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, re, shutil
          from pathlib import Path
          bundle_id = os.environ["SIGNING_BUNDLE_ID"].strip()
          if not re.fullmatch(r"[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+", bundle_id):
              raise SystemExit("Bundle ID must be a dotted identifier without the 10-character Team ID prefix")
          if bundle_id == "com.tglab.shifourentong.ios":
              print("Requested app ID already equals the default app ID")
          tmp = Path(os.environ["RUNNER_TEMP"])
          src = tmp / "aertex-derived/Build/Products/Release-iphoneos/AERTEX.app"
          target = tmp / "aertex-profile-matched/Payload/AERTEX.app"
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src, target, dirs_exist_ok=True, symlinks=True)
          # The diagnostic package intentionally contains no Watch target.
          # An unsigned Info.plist may safely be changed BEFORE signing.
          shutil.rmtree(target / "PlugIns" / "AERTEXWatch.app", ignore_errors=True)
          shutil.rmtree(target / "_CodeSignature", ignore_errors=True)
          (target / "embedded.mobileprovision").unlink(missing_ok=True)
          info_path = target / "Info.plist"
          with info_path.open("rb") as handle:
              info = plistlib.load(handle)
          info["CFBundleIdentifier"] = bundle_id
          with info_path.open("wb") as handle:
              plistlib.dump(info, handle)
          with info_path.open("rb") as handle:
              assert plistlib.load(handle)["CFBundleIdentifier"] == bundle_id
          print("Profile-matched iPhone-only unsigned IPA prepared, bundle ID:", bundle_id)
          PY
          ( cd "$RUNNER_TEMP/aertex-profile-matched" &&
            zip -qry "$GITHUB_WORKSPACE/dist/AERTEX-iphone-profile-match-unsigned.ipa" Payload )
          test -s dist/AERTEX-iphone-profile-match-unsigned.ipa

      - name: Prepare and verify locally sealed IPA for third-party re-signing
        # This is a local ad-hoc integrity test, not an Apple provisioning signature.
        # On unsigned Xcode 26 device bundles, a direct parent sign misidentifies
        # unsigned Assets.car and AppIcon resources as embedded code. The first
        # recursive pass pre-seals them; then explicitly re-sign the parent.
        # Do NOT use --deep for real Apple distribution/profile signing.
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/aertex-derived/Build/Products/Release-iphoneos/AERTEX.app"
          app="$RUNNER_TEMP/aertex-adhoc/Payload/AERTEX.app"
          mkdir -p "$RUNNER_TEMP/aertex-adhoc/Payload"
          ditto "$src" "$app"
          watch="$app/PlugIns/AERTEXWatch.app"
          test -s "$watch/AERTEXWatch"
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$watch"
          codesign --verify --strict --verbose=2 "$watch"
          # Diagnostic pre-seal only. Confirmed on macos-26/Xcode 26.6.
          codesign --force --deep --sign - --timestamp=none --generate-entitlement-der "$app"
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$app"
          # The sealed container must include a still-valid signed Watch.
          codesign --verify --strict --verbose=2 "$watch"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$watch" 2>&1 | grep -E 'Identifier=|CodeDirectory|Signature='
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Identifier=|CodeDirectory|Signature='
          ( cd "$RUNNER_TEMP/aertex-adhoc" && zip -qry "$GITHUB_WORKSPACE/dist/AERTEX-watch-adhoc-verified.ipa" Payload )
          test -s dist/AERTEX-watch-adhoc-verified.ipa
          echo "Verified ad-hoc IPA: local integrity/re-signing source only; not device-installable."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERTEX-Xcode-build-log
          path: |
            ${{ runner.temp }}/aertex-xcodebuild.log
            ${{ runner.temp }}/aertex-watch-build.log
            ${{ runner.temp }}/aertex-ipad-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload optional profile-matched iPhone IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_bundle_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AERTEX-iphone-profile-match-test
          path: dist/AERTEX-iphone-profile-match-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload iPhone-only signing diagnostic IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERTEX-iphone-only-signing-test
          path: dist/AERTEX-iphone-only-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified ad-hoc signing source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERTEX-watch-adhoc-signing-test
          path: dist/AERTEX-watch-adhoc-verified.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERTEX-unsigned-iOS-app
          path: dist/AERTEX-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14
