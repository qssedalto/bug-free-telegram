name: AERTEX iOS Swift Syntax

on:
  pull_request:
    paths:
      - "iOS重构版/Sources/**/*.swift"
      - "iOS重构版/Package.swift"
      - "iOS重构版/xtool.yml"
      - "iOS重构版/xtool-Info.plist"
      - "iOS重构版/CI/**"
      - "iOS重构版/Sources/是否认同/Resources/AERTEXMark.png"
      - "iOS重构版/Sources/是否认同/Resources/AERTEXWordmark.svg"
      - ".github/workflows/aertex-ios-syntax.yml"
  push:
    branches: [main]
    paths:
      - "iOS重构版/Sources/**/*.swift"
      - "iOS重构版/Package.swift"
      - "iOS重构版/xtool.yml"
      - "iOS重构版/xtool-Info.plist"
      - "iOS重构版/CI/**"
      - "iOS重构版/Sources/是否认同/Resources/AERTEXMark.png"
      - "iOS重构版/Sources/是否认同/Resources/AERTEXWordmark.svg"
      - ".github/workflows/aertex-ios-syntax.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check Swift parser availability
        run: swiftc --version
      - name: Parse native iOS Swift source
        run: |
          find "iOS重构版/Sources" -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
      - name: Generate and verify the same AERTEX icon for xtool and Xcode
        working-directory: iOS重构版
        run: bash CI/prepare_xtool.sh
      - name: Validate xtool provisioning metadata
        run: |
          python3 - <<'PY'
          import pathlib
          import plistlib
          import re

          root = pathlib.Path("iOS重构版")
          manifest = (root / "xtool.yml").read_text(encoding="utf-8")
          assert re.search(r"^infoPath:\s*xtool-Info\.plist\s*$", manifest, re.M), "xtool must use its own Info.plist"
          assert re.search(r"^bundleID:\s*com\.tglab\.shifourentong\.ios\s*$", manifest, re.M), "unexpected xtool bundle ID"
          with (root / "xtool-Info.plist").open("rb") as stream:
              metadata = plistlib.load(stream)
          for key in ("CFBundleIdentifier", "CFBundleExecutable", "CFBundleName"):
              assert key not in metadata, f"{key} must be generated by xtool"
          assert not any("$(" in str(v) for v in metadata.values()), "Xcode macros cannot be resolved by xtool"
          assert metadata["CFBundleDisplayName"] == "AERTEX"
          assert len(metadata["UISupportedInterfaceOrientations~ipad"]) == 4
          print("xtool Info.plist safe for Apple Developer provisioning")
          PY
      - name: Enforce native service contract and no embedded WebViews
        run: |
          grep -q 'AERTEXStudioNativeView' "iOS重构版/Sources/是否认同/AERTEXNativeServices.swift"
          grep -q 'AERTEXIntelligenceNativeView' "iOS重构版/Sources/是否认同/AERTEXIntelligenceChat.swift"
          grep -q 'sendAIMessage' "iOS重构版/Sources/是否认同/AERTEXAuth.swift"
          grep -q 'WKWebsiteDataStore' "iOS重构版/Sources/是否认同/AERTEXRichMessageView.swift" || grep -q 'nonPersistent()' "iOS重构版/Sources/是否认同/AERTEXRichMessageView.swift"
          grep -q 'cdn.jsdelivr.net/npm/katex@0.16.11' "iOS重构版/Sources/是否认同/Resources/AERTEXRichMessage.js"
          grep -q 'capsuleTabBar' "iOS重构版/Sources/是否认同/AERTEXRootView.swift"
          grep -q 'AERTEXWatchNativeView' "iOS重构版/Sources/是否认同/AERTEXNativeServices.swift"
          ! grep -E '(WKWebView|UIWebView|SFSafariViewController)' "iOS重构版/Sources/是否认同/AERTEXNativeServices.swift"
          grep -q 'AERTEXServiceLink(service: service)' "iOS重构版/Sources/是否认同/AERTEXRootView.swift"

# This is parser/static validation only; full iOS SDK compilation and
# Apple code signing still require the user's configured xtool environment.
